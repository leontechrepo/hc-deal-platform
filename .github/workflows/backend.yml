name: Backend

on:
  push:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hc_deal_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5544/hc_deal_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test (DB-backed tests must run, not skip)
        run: python -m pytest tests -q -rs
